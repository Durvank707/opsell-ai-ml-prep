<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f46e5'/><path d='M10 22V10h2.6l6.8 8.4V10H22v12h-2.6l-6.8-8.4V22z' fill='white'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>EcomAI-OS | AI-Powered Inventory Intelligence</title>
    <meta
      name="description"
      content="EcomAI-OS helps e-commerce businesses understand inventory, predict demand, and make better stock decisions."
    />
    <script>
      // Apply the saved (or system) theme before the first paint.
      //
      // Every colour in the app is a CSS custom property declared twice in
      // src/index.css — once under :root and once under .dark — so flipping one
      // class on <html> is the whole switch. Doing it here rather than in React
      // means the first frame is already the right theme instead of flashing
      // white before the bundle loads. ThemeProvider re-reads the same values
      // once it mounts and finds them already correct, so nothing jumps.
      (function () {
        try {
          var stored = localStorage.getItem('ecomai-theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#090e1a' : '#ffffff');
        } catch (e) {
          /* storage blocked: fall through to the light theme in index.css */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
